name: Crear APK Telegram Widget

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Instalar SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          mkdir proyecto
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d proyecto

      - name: Corregir configuración del proyecto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          project = Path("proyecto/TelegramMessagesWidget")

          # Corregir la descripción del widget para que use un recurso Android.
          xml_candidates = list(project.glob("app/src/main/res/xml/*widget*.xml"))
          if len(xml_candidates) != 1:
              sys.exit(f"Se esperaba un XML de widget y se encontraron: {xml_candidates}")

          xml_file = xml_candidates[0]
          xml = xml_file.read_text(encoding="utf-8")
          xml, count = re.subn(
              r'android:description="[^"]*"',
              'android:description="@string/widget_description"',
              xml,
              count=1
          )
          if count == 0 and 'android:description="@string/widget_description"' not in xml:
              sys.exit(f"No se encontró android:description en {xml_file}")
          xml_file.write_text(xml, encoding="utf-8")

          values_dir = project / "app/src/main/res/values"
          values_dir.mkdir(parents=True, exist_ok=True)
          strings_file = values_dir / "strings.xml"
          description = "Mensajes recientes de Telegram en una lista desplazable"
          entry = f'<string name="widget_description">{description}</string>'

          if strings_file.exists():
              strings = strings_file.read_text(encoding="utf-8")
              pattern = r'<string\s+name="widget_description">.*?</string>'
              if re.search(pattern, strings, re.S):
                  strings = re.sub(pattern, entry, strings, count=1, flags=re.S)
              else:
                  strings = strings.replace("</resources>", f"    {entry}\n</resources>")
              strings_file.write_text(strings, encoding="utf-8")
          else:
              strings_file.write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<resources>\n'
                  f'    {entry}\n'
                  '</resources>\n',
                  encoding="utf-8"
              )

          # Alinear Java y Kotlin en JVM 17 para evitar la incompatibilidad 1.8/17.
          gradle_file = project / "app/build.gradle"
          if not gradle_file.exists():
              sys.exit(f"No se encontró {gradle_file}")

          gradle = gradle_file.read_text(encoding="utf-8")
          if "compileOptions" not in gradle:
              closing = gradle.rfind("\n}")
              if closing == -1:
                  sys.exit("No se encontró el cierre del bloque android en app/build.gradle")
              settings = '''
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          '''
              gradle = gradle[:closing] + "\n" + settings + gradle[closing:]
              gradle_file.write_text(gradle, encoding="utf-8")

          print(f"XML del widget corregido: {xml_file}")
          print(f"Java/Kotlin configurados para JVM 17: {gradle_file}")
          PY

      - name: Compilar APK
        run: |
          cd proyecto/TelegramMessagesWidget
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Widget-APK
          path: proyecto/TelegramMessagesWidget/app/build/outputs/apk/debug/app-debug.apk
