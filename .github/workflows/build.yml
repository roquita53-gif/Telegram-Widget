name: Crear APK Telegram Widget

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          mkdir proyecto
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          unzip -q "$ZIP_FILE" -d proyecto

      - name: Compilar APK
        run: |
          cd proyecto/TelegramMessagesWidget
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Widget-APK
          path: proyecto/TelegramMessagesWidget/app/build/outputs/apk/debug/app-debug.apk
