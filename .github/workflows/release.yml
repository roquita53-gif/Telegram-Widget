name: Crear APK Telegram Widget (Release)

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceptar licenzas Android
        run: yes | sdkmanager --licenses

      - name: Instalar paquetes Android necesarios
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proxecto
        run: |
          mkdir -p proyecto
          unzip -q TelegramMessagesWidget_RELEASE_FIRMADO.zip -d proyecto
          test -f proyecto/app/build.gradle

      - name: Preparar clave de sinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Falta o segredo ANDROID_KEYSTORE_BASE64"; exit 1; }
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/release.jks"
          test -s "$RUNNER_TEMP/signing/release.jks"

      - name: Compilar APK Release asinado
        working-directory: proyecto
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Falta ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Falta ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Falta ANDROID_KEY_PASSWORD"; exit 1; }
          gradle --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Gardar APK Release
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Widget-APK-Release
          path: proyecto/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
